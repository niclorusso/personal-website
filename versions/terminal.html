<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Lo Russo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/nico.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Preview 31: the site as a command line. Type "help". */
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#0d0d0c;color:#f4efe4;font:500 clamp(15px,.8vw,18px)/1.55 "JetBrains Mono",ui-monospace,monospace;padding:clamp(14px,2.6vw,36px);padding-bottom:90px}
#out{white-space:pre-wrap;overflow-wrap:anywhere}
#out b{color:#ffe600;font-weight:500}#out i{font-style:normal;opacity:.55}
#out a,#out .h{all:unset;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
#out .p,#out .h{display:grid;gap:0 2ch;width:100%}
#out .p{grid-template-columns:2ch 11ch minmax(0,1fr)}#out .p b{text-align:right}
#out .h{grid-template-columns:8ch minmax(0,1fr)}
#out a:focus-visible,#out .h:focus-visible,#out a:active,#out .h:active{background:#ffe600;color:#0d0d0c}
@media(hover:hover){#out a:hover,#out .h:hover{background:#ffe600;color:#0d0d0c}#out a:hover b,#out .h:hover b{color:inherit}}
#out a:focus-visible b,#out .h:focus-visible b,#out a:active b,#out .h:active b{color:inherit}
#out .k{all:unset;color:#ffe600;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
#out .k::after{content:"";position:absolute;inset:-10px -12px}
#out .k:focus-visible{background:#ffe600;color:#0d0d0c}
#out .big{font:800 clamp(40px,8vw,110px)/.85 "Bricolage Grotesque",system-ui,sans-serif;font-stretch:75%;letter-spacing:-.02em;display:block;margin:0 0 18px;white-space:normal}
#out .nlr-dot::after{inset:-16px}
form{display:flex;gap:1ch;align-items:center;margin-top:10px;padding:6px 0}
form>span{color:#ffe600;white-space:nowrap}
#pd{all:unset;flex:none;width:.72em;height:.72em;border-radius:50%;background:#ffe600;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;transition:transform .25s cubic-bezier(.3,1.8,.4,1)}
#pd::after{content:"";position:absolute;inset:-15px}
#pd:focus-visible{outline:2px solid #f4efe4;outline-offset:4px}
@media(hover:hover){#pd:hover{transform:scale(1.5)}}
.w{flex:1;min-width:0;display:block}
input{all:unset;display:block;width:100%;caret-color:#ffe600}
@media(max-width:600px){body{font-size:13px}#out .p,#out .h{padding:4px 0}#out .p{gap:0 1.5ch}
  /* 16px in the field, so that phones do not zoom on focus; scaled back to the size of the text */
  .w{overflow:hidden;height:1.55em}input{font-size:16px;line-height:1.26;width:123.1%;transform:scale(.8125);transform-origin:0 50%}}
</style>
</head>
<body>
<div id="out"></div>
<form id="f" autocomplete="off"><button id="pd" type="button" data-nlr-dot aria-label="Another version of this site"></button><span>visitor@nicolalorusso.ch&nbsp;~&nbsp;$</span><label class="w"><input id="in" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Command" autofocus></label></form>
<script src="posts-data.js"></script>
<script>
(function(){
  var out=document.getElementById('out'),inp=document.getElementById('in'),form=document.getElementById('f'),hist=[],hi=0,touch=false,vv=window.visualViewport;
  var PS='<i>visitor@nicolalorusso.ch ~ $</i> ';
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
  // keeps the prompt above the "Back to the site" pill, or above the keyboard of a phone
  function keep(){var kb=vv?Math.max(0,innerHeight-vv.height):0,open=kb>120&&vv.scale<1.05;document.body.style.paddingBottom=(open?kb+24:90)+'px';
    var bottom=(vv?vv.offsetTop+vv.height:innerHeight)-(open?10:56),r=form.getBoundingClientRect();if(r.bottom>bottom)scrollBy(0,r.bottom-bottom)}
  function say(html){var d=document.createElement('div');d.innerHTML=html;out.appendChild(d);keep()}
  function fd(d){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return d.slice(8,10)+' '+m[parseInt(d.slice(5,7),10)-1]+' '+d.slice(0,4)}
  function url(p){return '../posts/'+p.id+'.html'}
  function ls(){say(POSTS.map(function(p,i){return '<a class="p" href="'+url(p)+'"><b>'+(i+1)+'</b><i>'+fd(p.d)+'</i><span>'+esc(p.t)+'</span></a>'}).join(''))}
  function h(c,k,t){return '<button type="button" class="h" data-c="'+c+'"><b>'+k+'</b><span>'+t+'</span></button>'}
  var CMD={
    help:function(){say(h('ls','ls','list the posts')+h('open ','open N','read post number N')+h('random','random','read one at random')+h('about','about','who writes here')+h('projects','projects','things I built')+h('clear','clear','clean the screen')+h('exit','exit','go back to the normal site')+h('dot','dot','?'))},
    ls:ls,dir:ls,
    open:function(a){var n=parseInt(a,10);if(!n||n<1||n>POSTS.length)return say('open: give a number from 1 to '+POSTS.length);say('opening <b>'+esc(POSTS[n-1].t)+'</b>...');setTimeout(function(){location.href=url(POSTS[n-1])},500)},
    random:function(){CMD.open(1+Math.floor(Math.random()*POSTS.length))},
    about:function(){say('Nicola Lo Russo, AI engineer at ETH Zurich.\n<a href="../cv.html">-> open the About page</a>')},
    projects:function(){say('<a href="../projects.html">-> open the projects</a>')},
    clear:function(){out.innerHTML='';say('<span class="big" data-nlr-name>Nicola Lo Russo</span>');if(window.nlrDress)nlrDress();scrollTo(0,0)},
    exit:function(){say('bye.');setTimeout(function(){location.href='../index.html'},400)},
    whoami:function(){say('visitor')},pwd:function(){say('/home/visitor')},date:function(){say(esc(new Date().toString()))},
    sudo:function(){say('visitor is not in the sudoers file. This incident will be reported.')},
    dot:function(){document.getElementById('pd').click()},
    hello:function(){say('hello.')},hi:function(){say('hello.')},
    rm:function(){say('rm: the posts are read-only. Good try.')},
    cat:function(a){CMD.open(a)},read:function(a){CMD.open(a)},cd:function(){say('there is only one room here.')},
    vim:function(){say('you are now stuck in vim. (not really: type "exit")')}
  };
  function run(v){say(PS+esc(v));if(!v)return;hist.push(v);hi=hist.length;
    var parts=v.split(/\s+/),c=parts[0].toLowerCase();if(/^\d+$/.test(c))return CMD.open(c);if(CMD.hasOwnProperty(c))CMD[c](parts.slice(1).join(' '));else say(esc(c)+': command not found. Type <button type="button" class="k" data-c="help">help</button>.')}
  form.addEventListener('submit',function(e){e.preventDefault();var v=inp.value.trim();inp.value='';run(v)});
  inp.addEventListener('keydown',function(e){if(e.key==='ArrowUp'&&hi>0){hi--;inp.value=hist[hi];e.preventDefault()}else if(e.key==='ArrowDown'){hi=Math.min(hist.length,hi+1);inp.value=hist[hi]||''}});
  addEventListener('pointerdown',function(e){touch=e.pointerType==='touch'},true);
  document.addEventListener('click',function(e){var b=e.target.closest('[data-c]');
    if(b){var c=b.getAttribute('data-c');if(/ $/.test(c)){inp.value=c;inp.focus()}else{run(c);if(!touch)inp.focus()}return}
    if(!e.target.closest('a,button')&&!String(getSelection()))inp.focus()});
  // typing anywhere goes to the prompt
  addEventListener('keydown',function(e){if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key!==' '&&document.activeElement!==inp)inp.focus()});
  if(vv)vv.addEventListener('resize',function(){if(document.activeElement===inp)keep()});
  inp.addEventListener('focus',function(){setTimeout(keep,350)});
  say('<span class="big" data-nlr-name>Nicola Lo Russo</span>'+POSTS.length+' posts, last one on '+fd(POSTS[0].d)+'.\nType <button type="button" class="k" data-c="help">help</button> and press enter.\n');
})();
</script>
<script src="world.js"></script>
</body>
</html>
