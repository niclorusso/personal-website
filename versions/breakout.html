<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Lo Russo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/dot.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Preview 36: the posts are a wall of bricks and the dot is the ball. A brick that is hit falls and piles up at the bottom, where it can still be clicked. */
:root{--A:#0b3fd0;--B:#ffe600;--paper:#f4efe4;--ink:#0d0d0c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--paper);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:none}
.mono{font:500 11px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.d{font-weight:800;font-stretch:75%;letter-spacing:-.02em}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px clamp(12px,2.6vw,40px)}
#wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:4px clamp(12px,2.6vw,40px)}
.brick{display:flex;flex-direction:column;justify-content:space-between;gap:4px;height:clamp(50px,8vh,74px);padding:7px 9px;background:var(--A);color:var(--paper);text-decoration:none;transition:background .15s,color .15s;overflow:hidden}
.brick h3{margin:0;font-size:clamp(12px,1.25vw,17px);line-height:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.brick .mono{font-size:9px;opacity:.7}
.brick:hover{background:var(--paper);color:var(--ink)}
.brick.gone{visibility:hidden}
.chip{position:fixed;left:0;top:0;z-index:3;width:var(--cw);height:var(--ch);display:flex;align-items:center;padding:0 9px;background:var(--B);color:var(--ink);text-decoration:none;will-change:transform;box-shadow:0 0 0 1.5px var(--ink)}
.chip h3{margin:0;font-size:12.5px;line-height:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip:hover{background:var(--paper)}
#ball{all:unset;position:fixed;left:0;top:0;width:20px;height:20px;border-radius:50%;background:var(--B);pointer-events:none;z-index:4}
/* when every brick is down the ball stops in the middle and becomes the door to the next world */
#ball.door{pointer-events:auto;cursor:pointer;z-index:6}#ball.door::after{content:"";position:absolute;inset:-14px;border-radius:50%}
#ball.door:focus-visible{outline:2px solid var(--paper);outline-offset:6px}
#pad{position:fixed;left:0;top:0;width:150px;height:12px;border-radius:99px;background:var(--paper);pointer-events:none;z-index:4}
#msg{position:fixed;left:0;right:0;top:0;text-align:center;pointer-events:none;opacity:.75}
:root{--cw:172px;--ch:44px}
@media(max-width:800px){#wall{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.brick{height:46px;padding:5px 6px}.brick h3{font-size:10.5px}.brick .mono{display:none}#pad{width:110px}:root{--cw:118px;--ch:34px}.chip{padding:0 6px}.chip h3{font-size:10px}}
@media(max-height:520px){:root{--cw:118px;--ch:34px}.chip{padding:0 6px}.chip h3{font-size:10px}}
</style>
</head>
<body>
<header><span data-nlr-name class="nlr-wm">Nicola Lo Russo</span><span class="mono" id="count"></span></header>
<main id="wall"></main>
<div id="ball"></div><div id="pad"></div><div id="msg" class="mono">Click</div>
<script src="posts-data.js"></script>
<script>
(function(){
  var wall=document.getElementById('wall'),ball=document.getElementById('ball'),pad=document.getElementById('pad'),msg=document.getElementById('msg'),count=document.getElementById('count');
  var bricks=POSTS.map(function(p){var a=document.createElement('a'),d=new Date(p.d+'T12:00');a.className='brick';a.href='../posts/'+p.id+'.html';a.innerHTML='<h3 class="d"></h3><span class="mono"></span>';
    a.querySelector('h3').textContent=p.t;a.querySelector('.mono').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});wall.appendChild(a);return {el:a,hit:false,p:p}});
  var W=innerWidth,H=innerHeight,R=10,px=W/2,pw=150,py=0,pyT=0,x=0,y=0,vx=0,vy=0,stuck=true,hits=0,speed=0,chips=[],CW=172,CH=44,pill=null,START=matchMedia('(pointer:coarse)').matches?'Tap':'Click';msg.textContent=START;
  function measure(){W=innerWidth;H=innerHeight;pw=pad.offsetWidth;var cs=getComputedStyle(document.documentElement);CW=parseFloat(cs.getPropertyValue('--cw'))||172;CH=parseFloat(cs.getPropertyValue('--ch'))||44;var pe=document.getElementById('nlr-w');pill=pe?pe.getBoundingClientRect():null;
    bricks.forEach(function(b){b.r=b.el.getBoundingClientRect()});speed=Math.max(360,H*.58);restack();if(!py)py=pyT=H-70}
  function label(){count.textContent='Down '+hits+' of '+bricks.length}
  function serve(){if(!stuck||won)return;stuck=false;var a=(-.25-Math.random()*.5)*Math.PI;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;msg.style.opacity=0}
  addEventListener('pointermove',function(e){px=e.clientX});addEventListener('pointerdown',function(e){px=e.clientX;if(!e.target.closest('a,button'))serve()});
  addEventListener('keydown',function(e){if(e.key===' '){e.preventDefault();serve()}if(e.key==='ArrowLeft')px-=50;if(e.key==='ArrowRight')px+=50});
  addEventListener('resize',measure);addEventListener('load',measure);measure();label();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
  // a brick that is hit leaves the wall and falls as a smaller chip; chips pile up on the floor and on each other.
  // The floor is the bottom of the window, or the top of the "Back to the site" link where that is in the way.
  function floor(cx){return pill&&cx+CW>pill.left-4&&cx<pill.right+4?pill.top-CH-5:H-CH-3}
  function landAt(cx,list,skip){var land=floor(cx);for(var j=0;j<list.length;j++){var q=list[j];if(q!==skip&&cx<q.tx+CW-10&&cx+CW>q.tx+10)land=Math.min(land,q.ty-CH)}return land}
  // where a chip comes to rest: on a narrow screen in the lowest of the columns that fit, so the pile stays low; otherwise near its brick, in the lowest of three tries
  function pick(bx,list,grid){var c=[],i,n,best=0,by=-1e9;
    if(W<700||grid){n=Math.max(1,Math.floor((W-4)/CW));for(i=0;i<n;i++)c.push(n>1?2+i*(W-4-CW)/(n-1):(W-CW)/2);c.sort(function(a,b){return Math.abs(a-bx)-Math.abs(b-bx)})}
    else for(i=0;i<3;i++)c.push(Math.max(2,Math.min(W-CW-2,bx+(Math.random()-.5)*CW*1.9)));
    for(i=0;i<c.length;i++){var l=landAt(c[i],list);if(l>by+.5){by=l;best=c[i]}}return {x:best,y:by}}
  function put(c){c.el.style.transform='translate('+c.x.toFixed(1)+'px,'+c.y.toFixed(1)+'px) rotate('+(c.rest?c.rot*.5:c.rot).toFixed(1)+'deg)'}
  function restack(){var done=[];chips.forEach(function(c){var t=pick(c.tx,done,true);c.tx=c.x=t.x;c.ty=c.y=t.y;c.vy=0;c.rest=true;done.push(c);put(c)})}
  function drop(b){b.hit=true;hits++;b.el.classList.add('gone');label();if(hits>=bricks.length)setTimeout(win,350);
    var a=document.createElement('a');a.className='chip';a.href=b.el.href;a.innerHTML='<h3 class="d"></h3>';a.querySelector('h3').textContent=b.p.t;document.body.appendChild(a);
    var x0=b.r.left+(b.r.width-CW)/2,t=pick(x0,chips),c={el:a,x:Math.max(2,Math.min(W-CW-2,x0)),y:b.r.top,tx:t.x,ty:t.y,vy:-120,rot:(Math.random()-.5)*7,rest:false};chips.push(c);put(c)}
  function fall(dt){var top=H,rest=chips.filter(function(c){return c.rest});
    for(var i=0;i<chips.length;i++){var c=chips[i];
      if(!c.rest){c.vy+=1900*dt;c.y+=c.vy*dt;c.x+=(c.tx-c.x)*Math.min(1,dt*9);var land=landAt(c.tx,rest,c);
        if(c.y>=land){c.y=land;if(c.vy>260)c.vy=-c.vy*.22;else{c.rest=true;c.vy=0;c.x=c.tx;c.ty=land;rest.push(c)}}
        put(c)}
      if(c.rest)top=Math.min(top,c.y)}
    pyT=Math.min(H-70,top-46)}
  var last=performance.now();
  var won=false,grow=1;
  function win(){won=true;stuck=false;vx=vy=0;msg.style.opacity=0;ball.classList.add('door');ball.setAttribute('tabindex','0');ball.setAttribute('role','button');ball.setAttribute('aria-label','Another version of this site')}
  ball.addEventListener('click',function(){if(won&&window.nlrGo)nlrGo(ball)});ball.addEventListener('keydown',function(e){if(won&&(e.key==='Enter'||e.key===' ')&&window.nlrGo){e.preventDefault();nlrGo(ball)}});
  function step(dt){
    if(won){var tx=W/2,ty=Math.max(90,Math.min(pyT-70,H*.36));x+=(tx-x)*Math.min(1,dt*5);y+=(ty-y)*Math.min(1,dt*5);grow+=(2.1-grow)*Math.min(1,dt*4);ball.style.transform='translate('+(x-R)+'px,'+(y-R)+'px) scale('+grow.toFixed(3)+')';var pl0=Math.max(0,Math.min(W-pw,px-pw/2));py+=(pyT-py)*Math.min(1,dt*6);pad.style.transform='translate('+pl0+'px,'+py.toFixed(1)+'px)';pad.style.opacity=Math.max(0,+(pad.style.opacity||1)-dt*2);return}
    py+=(pyT-py)*Math.min(1,dt*6);
    var pl=Math.max(0,Math.min(W-pw,px-pw/2));pad.style.transform='translate('+pl+'px,'+py.toFixed(1)+'px)';msg.style.transform='translateY('+(py-46)+'px)';
    if(stuck){x=pl+pw/2;y=py-R-1}else{
      x+=vx*dt;y+=vy*dt;
      if(x<R){x=R;vx=Math.abs(vx)}if(x>W-R){x=W-R;vx=-Math.abs(vx)}if(y<R){y=R;vy=Math.abs(vy)}
      if(vy>0&&y+R>=py&&y+R<=py+26&&x>pl-R&&x<pl+pw+R){var off=(x-(pl+pw/2))/(pw/2),a=(-.5+off*.36)*Math.PI;vx=Math.cos(a)*speed;vy=Math.sin(a)*speed;y=py-R}
      if(y>H+40){stuck=true;msg.textContent=hits>=bricks.length?'':START;msg.style.opacity=.75}
      for(var i=0;i<bricks.length;i++){var b=bricks[i],r=b.r;if(b.hit)continue;var cx=Math.max(r.left,Math.min(x,r.right)),cy=Math.max(r.top,Math.min(y,r.bottom)),dx=x-cx,dy=y-cy;
        if(dx*dx+dy*dy<R*R){if(Math.abs(dx)>Math.abs(dy)){vx=(dx>0?1:-1)*Math.abs(vx);x=cx+(dx>0?R:-R)}else{vy=(dy>=0?1:-1)*Math.abs(vy);y=cy+(dy>=0?R:-R)}drop(b);break}}}
    ball.style.transform='translate('+(x-R)+'px,'+(y-R)+'px)'}
  (function frame(now){now=now||last;var dt=Math.min(.034,(now-last)/1000);last=now;step(dt/2);step(dt/2);fall(dt);requestAnimationFrame(frame)})();
  window.__drop=function(n){bricks.filter(function(b){return !b.hit}).slice(0,n).forEach(drop)}; // used by the test harness
})();
</script>
<script src="world.js"></script>
</body>
</html>
