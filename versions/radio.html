<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Lo Russo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/dot.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Preview 44: a radio. The page is noise; dragging the needle along the scale crosses twenty stations, one per post.
   Near a station the noise thins and the title comes into focus. The tuning lamp is the yellow dot: it lights only on a station. */
:root{--bg:#191410;--amber:#ffb24a;--cream:#f3e9d6;--dim:#f3e9d655}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--cream);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column}
#screen{position:relative;flex:1;min-height:0;overflow:hidden}
#noise{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#st{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:14px;padding:0 clamp(16px,5vw,80px);text-decoration:none;color:var(--cream);pointer-events:none}
#st.ok{pointer-events:auto}
#fig{display:block;width:clamp(120px,18vw,230px);aspect-ratio:4/3}
#st h2{margin:0;font-weight:800;font-size:clamp(28px,5.4vw,78px);line-height:.98;letter-spacing:-.035em;max-width:14em;text-wrap:balance}
#st span{font:500 12px/1 "DM Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
#st.ok h2{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.14em}
#face{position:relative;background:#241c15;border-top:2px solid #000;padding:14px clamp(16px,5vw,80px) 60px;touch-action:none}
#top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:10px}
#brand{font-weight:700;font-size:clamp(21px,1.8vw,24px);line-height:1.2;letter-spacing:-.01em}
#brand .nlr-dot::after{inset:-15px}
#lamp{all:unset;position:relative;width:22px;height:22px;border-radius:50%;background:#3a3027;box-shadow:inset 0 0 0 2px #0008;transition:background .15s,box-shadow .15s;pointer-events:none}
#lamp::after,#snd::after{content:"";position:absolute;inset:-10px}
#lamp:focus-visible,#snd:focus-visible{outline:2px solid var(--cream);outline-offset:4px}
#lamp.on{background:#ffe600;box-shadow:0 0 22px 4px #ffe60099;pointer-events:auto;cursor:pointer}
#right{display:flex;align-items:center;gap:22px}
#snd{all:unset;position:relative;cursor:pointer;width:22px;height:22px;opacity:.7}#snd:hover{opacity:1}#snd svg{display:block;width:100%;height:100%}#snd.on .off{display:none}
#dial{position:relative;height:74px;background:#0f0c09;border-radius:6px;box-shadow:inset 0 0 0 1px #000,inset 0 0 26px #ffb24a22;cursor:ew-resize;overflow:hidden}
#dial canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
@media(max-height:480px){#fig{display:none}#st{gap:10px}#st h2{font-size:clamp(22px,4.2vw,40px)}#face{padding-top:8px;padding-bottom:52px}}
#needle{position:absolute;top:0;bottom:0;left:0;width:3px;margin-left:-1.5px;background:#ff4a2e;box-shadow:0 0 10px #ff4a2e;pointer-events:none}
</style>
</head>
<body>
<div id="screen"><canvas id="noise" width="160" height="100"></canvas><a id="st" href="#" tabindex="-1"><canvas id="fig"></canvas><h2 id="ht"></h2><span id="hd"></span></a></div>
<div id="face">
  <div id="top"><span id="brand" data-nlr-name data-nlr-own>Nicola Lo Russo</span><div id="right"><button id="snd" type="button" aria-label="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="#f3e9d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#f3e9d6"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="off" d="M3 3l18 18"/></svg></button><button id="lamp" data-nlr-dot data-nlr-plain type="button" disabled aria-label="Another version of this site"></button></div></div>
  <div id="dial"><canvas id="scale"></canvas><div id="needle"></div></div>
</div>
<script src="posts-data.js"></script>
<script src="figures.js"></script>
<script>
(function(){
  var noise=document.getElementById('noise'),nc=noise.getContext('2d'),st=document.getElementById('st'),figC=document.getElementById('fig'),ht=document.getElementById('ht'),hd=document.getElementById('hd'),lamp=document.getElementById('lamp'),dial=document.getElementById('dial'),scale=document.getElementById('scale'),needle=document.getElementById('needle'),snd=document.getElementById('snd');
  var N=POSTS.length,F0=87.5,F1=108,f=97.3,raw=97.3,PAD=18,nd=true,still=matchMedia('(prefers-reduced-motion: reduce)').matches,cur=-1,q=0,tt=3,GL='ABCDEFGHJKLMNPRSTUVWXYZ#%&/=+*<>';
  // twenty stations at frequencies drawn again at every visit, not too close to each other
  var fr=[];for(var i=0;i<N;i++)fr.push(F0+.5+(F1-F0-1)*(i+.3+Math.random()*.4)/N);var order=fr.map(function(_,i){return i}).sort(function(){return Math.random()-.5}),station=[];order.forEach(function(k,i){station[i]=fr[k]});
  var WIDTH=(F1-F0)/N*.34;
  // the needle starts just beside a station: the title is there, out of focus
  f=raw=station.reduce(function(a,b){return Math.abs(b-97.3)<Math.abs(a-97.3)?b:a})-.2;
  function drawScale(){var d=Math.min(devicePixelRatio||1,2),w=dial.clientWidth,h=dial.clientHeight;scale.width=w*d;scale.height=h*d;var g=scale.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);g.fillStyle=g.strokeStyle='#ffb24a';g.font='500 10px "DM Mono",monospace';g.textAlign='center';
    for(var v=88;v<=108;v+=.5){var x=fx(v),big=v%2===0;g.globalAlpha=big?.9:.4;g.fillRect(x-.5,h-(big?26:14),1,big?26:14);if(big&&(w>520||v%4===0)){g.globalAlpha=.9;g.fillText(v,x,18)}}
    g.globalAlpha=.85;g.fillStyle='#f3e9d6';station.forEach(function(v){g.beginPath();g.arc(fx(v),31,1.6,0,7);g.fill()});g.globalAlpha=1;place()}
  function fx(v){return PAD+(v-F0)/(F1-F0)*(dial.clientWidth-2*PAD)}
  function place(){needle.style.transform='translateX('+fx(f)+'px)'}
  function fig(t){var p=POSTS[cur];if(!p)return;var d=Math.min(devicePixelRatio||1,2),w=figC.clientWidth,h=figC.clientHeight;if(!w)return;if(figC.width!==Math.round(w*d)){figC.width=Math.round(w*d);figC.height=Math.round(h*d)}
    var c=figC.getContext('2d'),vw=170,k=w/vw,m=10;c.setTransform(d*k,0,0,d*k,0,0);c.clearRect(0,0,vw,h/k);c.translate(m,m*.75);c.lineWidth=1.8;c.fillStyle=c.strokeStyle='#f3e9d6';(F[FIG[p.id]]||F.line)(c,vw-2*m,h/k-1.5*m,t,'#f3e9d6','#ffb24a')}
  function tune(){var best=-1,bd=9;for(var i=0;i<N;i++){var d=Math.abs(station[i]-f);if(d<bd){bd=d;best=i}}q=Math.exp(-(bd*bd)/(2*WIDTH*WIDTH*.35));if(bd>WIDTH*2.2){q=0}
    if(best!==cur&&q>0){cur=best;var p=POSTS[cur];hd.textContent=station[cur].toFixed(1)+' · '+new Date(p.d+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});st.href='../posts/'+p.id+'.html'}
    var ok=q>.9;st.classList.toggle('ok',ok);st.tabIndex=ok?0:-1;lamp.classList.toggle('on',ok);lamp.disabled=!ok;nd=true;st.style.opacity=Math.min(1,q*1.25).toFixed(2);st.style.filter='blur('+((1-q)*10).toFixed(1)+'px)';place();if(gain&&on){gain.gain.value=.07*(1-q*.95);if(tone)tone.gain.value=ok?.035:0}}
  // the needle catches on a station when it comes close enough, so that a finger can stop on it
  function setRaw(v){raw=Math.max(F0,Math.min(F1,v));var best=0,bd=99;for(var i=0;i<N;i++){var d=Math.abs(station[i]-raw);if(d<bd){bd=d;best=i}}var det=Math.min(.27,Math.max(.1,6*(F1-F0)/(dial.clientWidth-2*PAD)));f=bd<det?station[best]:raw;tune()}
  function setF(e){var r=dial.getBoundingClientRect();setRaw(F0+(e.clientX-r.left-PAD)/(r.width-2*PAD)*(F1-F0))}
  function step(dir){var s=station.slice().sort(function(a,b){return a-b}),t=null;if(dir>0){for(var i=0;i<N;i++)if(s[i]>f+.001){t=s[i];break}}else{for(var i=N-1;i>=0;i--)if(s[i]<f-.001){t=s[i];break}}if(t!==null)setRaw(t)}
  var dragging=false;dial.addEventListener('pointerdown',function(e){dragging=true;dial.setPointerCapture(e.pointerId);setF(e)});dial.addEventListener('pointermove',function(e){if(dragging)setF(e)});dial.addEventListener('pointerup',function(){dragging=false});dial.addEventListener('pointercancel',function(){dragging=false});
  addEventListener('keydown',function(e){if(e.metaKey||e.ctrlKey||e.altKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();step(1)}});
  addEventListener('wheel',function(e){var d=(e.deltaY||e.deltaX)*(e.deltaMode===1?16:1);setRaw(raw+Math.max(-.2,Math.min(.2,d*.003)))},{passive:true});
  // sound: off until the speaker is pressed. Hiss between stations, a steady note on a station
  var AC=null,gain=null,tone=null,osc=null,on=false;
  snd.addEventListener('click',function(){on=!on;snd.classList.toggle('on',on);if(on&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();var b=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;var s=AC.createBufferSource();s.buffer=b;s.loop=true;var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;gain=AC.createGain();s.connect(lp);lp.connect(gain);gain.connect(AC.destination);s.start();
      osc=AC.createOscillator();osc.type='triangle';tone=AC.createGain();tone.gain.value=0;osc.connect(tone);tone.connect(AC.destination);osc.start()}catch(e){AC=null}}if(!on&&gain){gain.gain.value=0;tone.gain.value=0}tune()});
  drawScale();tune();addEventListener('resize',function(){drawScale();nd=true});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawScale);
  var last=performance.now(),acc=0,img=nc.createImageData(160,100);
  (function frame(now){now=now||last;var dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;
    var upd=acc>.05&&(nd||!still);if(upd){acc=0;nd=false;var d=img.data,a=Math.round(255*(.55*(1-q)+.06));for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=v;d[i+1]=v*.93;d[i+2]=v*.82;d[i+3]=a}nc.putImageData(img,0,0);
      if(cur>=0){var t=POSTS[cur].t,out='';for(var j=0;j<t.length;j++)out+=(t[j]===' '||Math.random()<q*q*1.15)?t[j]:GL[Math.random()*GL.length|0];ht.textContent=q>.9?t:out;
        if(osc&&on){var n=t.charCodeAt(Math.floor(now/260)%t.length)%12;osc.frequency.value=220*Math.pow(2,[0,2,4,7,9,12,14,16,19,21,24,26][n]/12)}}}
    if(q>.05&&(!still||upd)){tt+=dt*.9;fig(tt)}requestAnimationFrame(frame)})();
  window.__radio=function(){return {PAD:PAD,f:f,q:q,cur:cur,station:station.slice(),F0:F0,F1:F1}};
})();
</script>
<script src="world.js"></script>
</body>
</html>
