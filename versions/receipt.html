<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Lo Russo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/dot.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d8442a;--paper:#fbfaf3;--ink:#17150f;--soft:#7d7a70}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:14.5px;line-height:1.45;min-height:100vh}
a{color:inherit;text-decoration:none}
.corner{position:fixed;z-index:3;color:#fbfaf3;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:18px 22px}
.corner a:hover{text-decoration:underline;text-underline-offset:4px}
.tl{left:0;top:0}.tr{right:0;top:0;display:flex;gap:20px}.bl{left:0;bottom:0}.br{right:0;bottom:0}
.wrap{display:flex;justify-content:center;padding:54px 14px 90px;overflow:hidden}
.receipt{position:relative;width:min(560px,100%);background:var(--paper);padding:34px 30px 46px;transform:rotate(-.45deg);transform-origin:50% 0;
  box-shadow:0 30px 60px -20px #0008,0 2px 0 #0001;animation:feed 1.5s cubic-bezier(.2,.8,.2,1) both;
  --z:10px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--z)),97.5% 100%,95% calc(100% - var(--z)),92.5% 100%,90% calc(100% - var(--z)),87.5% 100%,85% calc(100% - var(--z)),82.5% 100%,80% calc(100% - var(--z)),77.5% 100%,75% calc(100% - var(--z)),72.5% 100%,70% calc(100% - var(--z)),67.5% 100%,65% calc(100% - var(--z)),62.5% 100%,60% calc(100% - var(--z)),57.5% 100%,55% calc(100% - var(--z)),52.5% 100%,50% calc(100% - var(--z)),47.5% 100%,45% calc(100% - var(--z)),42.5% 100%,40% calc(100% - var(--z)),37.5% 100%,35% calc(100% - var(--z)),32.5% 100%,30% calc(100% - var(--z)),27.5% 100%,25% calc(100% - var(--z)),22.5% 100%,20% calc(100% - var(--z)),17.5% 100%,15% calc(100% - var(--z)),12.5% 100%,10% calc(100% - var(--z)),7.5% 100%,5% calc(100% - var(--z)),2.5% 100%,0 calc(100% - var(--z)))}
@keyframes feed{from{transform:translateY(-104%) rotate(0)}to{transform:translateY(0) rotate(-.45deg)}}
.c{text-align:center}
h1{margin:0;font-weight:700;font-size:34px;letter-spacing:.14em;line-height:1.1;text-transform:uppercase}
.up{text-transform:uppercase;letter-spacing:.08em}
.soft{color:var(--soft)}
hr{border:0;border-top:1.5px dashed var(--ink);margin:16px 0}
hr.d{border-top-style:double;border-top-width:4px}
.lede{margin:0;font-size:15px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:0 10px;padding:8px 6px;margin:0 -6px;align-items:baseline}
.item .t{font-weight:500;font-size:15.5px;line-height:1.3}
.item .d{grid-column:2;font-size:12.5px;color:var(--soft)}
.item .w{font-variant-numeric:tabular-nums;white-space:nowrap}
.item:hover{background:var(--ink);color:var(--paper)}.item:hover .d{color:#fbfaf3aa}
.tot{font-weight:700;font-size:19px}
.code{display:flex;justify-content:center;gap:0;height:64px;margin:22px 0 8px}
.code i{display:block;height:100%;background:var(--ink)}
@media(max-width:700px){.corner{position:static;padding:14px 16px 0}.tr{justify-content:flex-start}.bl,.br{display:none}.wrap{padding-top:22px}h1{font-size:25px}.receipt{padding:26px 18px 40px}}
@media(prefers-reduced-motion:reduce){.receipt{animation:none}}
</style>
</head>
<body>
<div class="corner tl"><span data-nlr-name data-nlr-own style="text-transform:none;font-weight:700;font-size:22px;letter-spacing:-.03em;line-height:1">Nicola Lo Russo</span></div>
<div class="corner tr"><a href="../index.html">Writing</a><a href="../projects.html">Projects</a><a href="../cv.html">About</a></div>
<div class="corner bl">© 2026</div>
<div class="corner br"></div>
<div class="wrap">
  <main class="receipt">
    <div class="c">
      <h1>Nicola<br>Lo Russo</h1>
      <div class="up" style="margin-top:8px">AI engineer · ETH Zurich</div>
    </div>
    <hr>
    <div class="kv up soft"><span id="day"></span><span id="time"></span></div>
    <div class="kv up soft"><span>Receipt n°</span><span id="rn"></span></div>
    <hr>
    <div class="kv up soft" style="padding:0 0 4px"><span>N° &nbsp;Post</span><span>Words</span></div>
    <div id="items"></div>
    <hr>
    <div class="kv up"><span>Posts</span><span id="np"></span></div>
    <div class="kv up"><span>Interactive</span><span id="ni"></span></div>
    <div class="kv up"><span>Words</span><span id="nw"></span></div>
    <hr class="d">
    <div class="kv up tot"><span>Total reading</span><span id="nm"></span></div>
    <hr class="d">
    <div class="code" id="code"></div>
    <div class="c up soft" style="letter-spacing:.3em">nicolalorusso.ch</div>
  </main>
</div>
<script src="posts-data.js"></script>

<script>
// The archive printed as a till receipt. Date and time are the moment of the visit; the totals are counted from the posts.
const now=new Date(),N=POSTS.length,fmt=n=>n.toLocaleString('en-GB'),W=p=>META[p.id]?.w||0,tot=POSTS.reduce((a,p)=>a+W(p),0);
document.getElementById('day').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
document.getElementById('time').textContent=now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
document.getElementById('rn').textContent=String(N).padStart(4,'0');
document.getElementById('items').innerHTML=POSTS.map((p,i)=>`<a class="item" href="../posts/${p.id}.html"><span>${String(N-i).padStart(2,'0')}</span><span class="t">${p.t}</span><span class="w">${fmt(W(p))}</span><span class="d">${new Date(p.d+'T12:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}${META[p.id]?.i?' · interactive':''}</span></a>`).join('');
document.getElementById('np').textContent=N;document.getElementById('ni').textContent=POSTS.filter(p=>META[p.id]?.i).length;
document.getElementById('nw').textContent=fmt(tot);document.getElementById('nm').textContent=Math.round(tot/225)+' min';
// bars from the letters of the domain
document.getElementById('code').innerHTML=[...'nicolalorusso.ch'].map(ch=>{const c=ch.charCodeAt(0);return [1,2,3].map(k=>`<i style="width:${1+(c>>k&3)}px;margin-right:${1+(c>>(k+2)&3)}px"></i>`).join('')}).join('');
</script>
<script src="world.js"></script>
</body>
</html>
