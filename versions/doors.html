<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicola Lo Russo</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/dot.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Preview 30: three doors, the site is behind one. Pick one, an empty one is opened, stay or switch. */
:root{--A:#0b3fd0;--B:#ffe600;--paper:#f4f2ec;--ink:#0d0d0c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.mono{font:500 11px/1.4 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.d{font-weight:800;font-stretch:75%;letter-spacing:-.02em}
button{all:unset;cursor:pointer}
button:focus-visible{outline:2px solid var(--B);outline-offset:3px}
#site button:focus-visible,.leaf:focus-visible{outline-color:var(--ink);outline-offset:-6px}
.nlr-dot::after{inset:-16px!important} /* a finger-sized target around the dot */
html.shut{overflow:hidden} /* nothing to scroll while the gate is down */
#gate{position:fixed;inset:0;z-index:10;background:var(--A);color:#f4efe4;display:flex;flex-direction:column;padding:14px clamp(16px,2.6vw,40px) 18px;transition:transform .9s cubic-bezier(.7,0,.2,1)}
#gate.open{transform:translateY(-101%)}
#gate nav{display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:nowrap}
#skip{padding:12px 0}
#gate nav button:hover{text-decoration:underline;text-underline-offset:4px}
#say{margin:clamp(10px,3vh,34px) 0 0;font-size:clamp(34px,6.4vw,96px);line-height:.88;max-width:13em;min-height:1.76em;text-wrap:balance}
#doors{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:clamp(12px,4vw,60px);padding-top:16px;min-height:0}
.door{position:relative;width:min(28vw,30vh);aspect-ratio:5/9;max-height:100%;background:#06102e;perspective:2600px} /* each door has its own point of view, so the three open the same way */
.door .in{position:absolute;inset:0;display:grid;place-items:center;color:#f4efe499;transition:padding .8s}
.door.open .in{padding-left:22%} /* the open leaf covers the left edge */
.door .in i{display:block;width:44%;aspect-ratio:1;border-radius:50%;background:var(--B)}
.door .leaf{position:absolute;inset:0;background:#f4efe4;color:var(--ink);transform-origin:0 50%;transition:transform .8s cubic-bezier(.5,0,.2,1),background .2s;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;backface-visibility:hidden;cursor:pointer}
.door .leaf b{font-size:clamp(50px,9vw,130px);line-height:.8}
.door .leaf span{align-self:flex-end;width:13px;height:13px;border-radius:50%;background:var(--ink);margin-bottom:38%}
.door:not(.open):not(.lock) .leaf:hover{background:var(--B)}
.door.pick .leaf{background:var(--B)}
.door.open .leaf{transform:rotateY(-76deg)}
.door.lock .leaf{cursor:default}
#act{position:relative;z-index:3;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:44px;padding-top:16px}
#act button{border:1.5px solid currentColor;border-radius:999px;padding:10px 18px}
#act button:hover{background:var(--B);color:var(--ink);border-color:var(--B)}
#stats{text-align:center;text-wrap:balance;padding-top:10px;min-height:2.6em;opacity:.8}#stats i{font-style:normal}
/* the site behind the door */
#site header{background:var(--A);color:#f4efe4;padding:14px clamp(16px,2.6vw,40px) 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
#site h1{margin:0;font-size:clamp(40px,7vw,104px);line-height:.85}
#site header button:hover{text-decoration:underline;text-underline-offset:4px}
#list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(22px,2.8vw,44px);padding:14px clamp(16px,2.6vw,40px) 64px}
.row{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:center;padding:8px 0;border-top:1.5px solid var(--ink);color:inherit;text-decoration:none}
.row canvas{display:block;width:76px;height:57px;background:var(--p)}
.row h3{margin:0 0 3px;font-size:clamp(16px,1.3vw,19px);line-height:1}
.row .mono{opacity:.6}
.row:hover{background:var(--B)}
@media(max-width:1000px){#list{grid-template-columns:repeat(2,minmax(0,1fr))}#gate{padding-bottom:58px}} /* and room for the pill in the corner */
@media(max-width:620px){#list{grid-template-columns:1fr}
  #site h1{font-size:min(14vw,64px)}#stats{min-height:4.2em}#stats span{display:block}#stats i,#stats br{display:none}
  #doors{align-items:center}.door{width:min(29vw,22vh);aspect-ratio:5/11}}
@media(max-width:400px){#skip{font-size:10px;letter-spacing:.04em}}
@media(max-height:520px){#say{font-size:clamp(24px,8vh,40px);min-height:0;max-width:none;margin-top:4px}#doors{align-items:flex-end;padding-top:10px}.door{width:auto;height:100%;aspect-ratio:5/7}#act{padding-top:10px}#stats{min-height:2.8em;padding:6px 150px 0}#stats span{display:inline}#stats i{display:inline}#stats br{display:inline}} /* a phone on its side: the last lines stay clear of the pill */
@media(prefers-reduced-motion:reduce){#gate,.door .leaf{transition:none}}
</style>
</head>
<body>
<div id="gate">
  <nav class="mono"><span data-nlr-name class="nlr-wm">Nicola Lo Russo</span><button id="skip" type="button">I just want to read</button></nav>
  <p id="say" class="d"></p>
  <div id="doors"></div>
  <div id="act" class="mono"></div>
  <div id="stats" class="mono"></div>
</div>
<div id="site">
  <header><h1 class="d" data-nlr-name>Nicola Lo Russo</h1><button id="again" class="mono" type="button">Lock the site again</button></header>
  <div id="list"></div>
</div>
<script src="posts-data.js"></script>
<script src="figures.js"></script>
<script>
(function(){
  var gate=document.getElementById('gate'),say=document.getElementById('say'),doorsEl=document.getElementById('doors'),act=document.getElementById('act'),statsEl=document.getElementById('stats');
  var S={stay:[0,0],sw:[0,0]};try{var S0=JSON.parse(localStorage.getItem('nlr-doors'));if(S0&&S0.stay&&S0.sw&&S0.stay.length===2&&S0.sw.length===2)S=S0}catch(e){}
  var prize,pick,shown,phase,doors=[];
  function btn(label,fn){var b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);act.appendChild(b)}
  function stats(){var n=S.stay[1]+S.sw[1];if(!n){statsEl.textContent='';return}
    var tm=function(k){return k===1?'once':k+' times'};statsEl.innerHTML='<span>You switched '+tm(S.sw[1])+' and won '+S.sw[0]+'</span><i> &middot; </i><span>you stayed '+tm(S.stay[1])+' and won '+S.stay[0]+'</span>'+(n>=3?'<br>Switching wins 2 times out of 3':'')}
  function build(){doorsEl.innerHTML='';doors=[0,1,2].map(function(i){var d=document.createElement('div');d.className='door';
    d.innerHTML='<div class="in mono"><span>Empty</span></div><button class="leaf" type="button" aria-label="Door '+(i+1)+'"><b class="d">'+(i+1)+'</b><span></span></button>';
    d.querySelector('.leaf').addEventListener('click',function(){choose(i)});doorsEl.appendChild(d);return d})}
  function reset(){prize=Math.floor(Math.random()*3);pick=shown=-1;phase=0;build();doors[prize].querySelector('.in').innerHTML='<i></i>';act.innerHTML='';say.textContent='Pick a door.';stats()}
  function choose(i){if(phase!==0)return;phase=1;pick=i;doors[i].classList.add('pick');doors.forEach(function(d){d.classList.add('lock')});
    var free=[0,1,2].filter(function(k){return k!==pick&&k!==prize});shown=free[Math.floor(Math.random()*free.length)];
    say.textContent='You picked door '+(i+1)+'.';
    setTimeout(function(){doors[shown].classList.add('open');var other=[0,1,2].filter(function(k){return k!==pick&&k!==shown})[0];
      say.textContent='Door '+(shown+1)+' is empty. Stay or switch?';
      btn('Stay with '+(pick+1),function(){end(pick,'stay')});btn('Switch to '+(other+1),function(){end(other,'sw')})},700)}
  function end(final,how){if(phase!==1)return;phase=2;act.innerHTML='';doors.forEach(function(d,k){d.classList.toggle('pick',k===final)});doors[final].classList.add('open');
    var win=final===prize;S[how][1]++;if(win)S[how][0]++;try{localStorage.setItem('nlr-doors',JSON.stringify(S))}catch(e){}stats();
    if(win){say.textContent='Door '+(final+1)+'. Come in.';setTimeout(enter,1300)}
    else setTimeout(function(){doors[prize].classList.add('open');say.textContent='Empty. The site was behind door '+(prize+1)+'.';btn('Try again',reset)},900)}
  var site=document.getElementById('site');
  // the side that is not on screen is out of reach of Tab and of the scroll
  function shut(v){gate.inert=!v;site.inert=v;document.documentElement.classList.toggle('shut',v)}
  function enter(){gate.classList.add('open');shut(false);try{sessionStorage.setItem('nlr-in','1')}catch(e){}paint()}
  document.getElementById('skip').addEventListener('click',enter);
  document.getElementById('again').addEventListener('click',function(){try{sessionStorage.removeItem('nlr-in')}catch(e){}reset();gate.classList.remove('open');shut(true);scrollTo(0,0)});
  // the list behind the gate
  var TONES=[['#0b3fd0','#f4efe4','#ffe600'],['#111111','#f4efe4','#ffe600'],['#e4dfd3','#0d0d0c','#0b3fd0']],rows=[];
  function fig(o,t){var cv=o.cv,d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;if(!w)return;if(cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
    var c=cv.getContext('2d'),vw=170,k=w/vw,m=12;c.setTransform(d*k,0,0,d*k,0,0);c.clearRect(0,0,vw,h/k);c.translate(m,m*.75);c.lineWidth=1.3;c.fillStyle=c.strokeStyle=o.T[1];(F[o.f]||F.line)(c,vw-2*m,h/k-1.5*m,t,o.T[1],o.T[2])}
  var list=document.getElementById('list');
  POSTS.forEach(function(p,i){var a=document.createElement('a'),T=TONES[i%3],d=new Date(p.d+'T12:00');a.className='row';a.href='../posts/'+p.id+'.html';a.style.setProperty('--p',T[0]);
    a.innerHTML='<canvas></canvas><div><h3 class="d"></h3><span class="mono"></span></div>';a.querySelector('h3').textContent=p.t;a.querySelector('.mono').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});list.appendChild(a);
    var o={cv:a.querySelector('canvas'),f:FIG[p.id],T:T,t:i*2.3+3,hover:false};a.addEventListener('pointerenter',function(){o.hover=true});a.addEventListener('pointerleave',function(){o.hover=false});rows.push(o)});
  function paint(){rows.forEach(function(o){fig(o,o.t)})}
  var last=performance.now();(function frame(now){var dt=Math.min(.05,((now||last)-last)/1000);last=now||last;rows.forEach(function(o){if(o.hover){o.t+=dt*1.5;fig(o,o.t)}});requestAnimationFrame(frame)})();
  reset();paint();var inside=false;try{inside=sessionStorage.getItem('nlr-in')==='1'}catch(e){}shut(!inside);if(inside){gate.style.transition='none';gate.classList.add('open');setTimeout(function(){gate.style.transition=''},50)}
  addEventListener('resize',paint);
})();
</script>
<script src="world.js"></script>
</body>
</html>
